<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Callie the Calico Cat, dental staff mascot (female)">
  <defs>
    <linearGradient id="catScrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6E8EE"/>
    </linearGradient>
    <linearGradient id="flossJar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6BBD0"/>
      <stop offset="1" stop-color="#EE9BBB"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="256" cy="486" rx="122" ry="14" fill="#3A2430" opacity="0.08"/>

  <!-- tail (behind, curled up on right) -->
  <path d="M 344 420 C 396 414 420 384 416 348 C 412 322 394 308 372 310 C 386 318 394 334 390 350 C 384 374 362 388 336 390 Z" fill="#FDFEFF"/>
  <path d="M 402 322 C 410 334 412 348 408 360 C 420 350 422 334 414 322 C 410 318 406 318 402 322 Z" fill="#E8933F"/>
  <path d="M 344 402 C 356 402 368 398 376 390 C 372 404 360 412 346 412 Z" fill="#3A3A44"/>

  <!-- legs / paw feet -->
  <path d="M 208 430 L 208 468 C 208 480 218 486 230 486 C 242 486 250 480 250 468 L 250 434 Z" fill="#FDFEFF"/>
  <path d="M 262 434 L 262 468 C 262 480 270 486 282 486 C 294 486 304 480 304 468 L 304 430 Z" fill="#FDFEFF"/>
  <g fill="#F5A8BC" opacity="0.85">
    <ellipse cx="229" cy="479" rx="7" ry="5"/><ellipse cx="283" cy="479" rx="7" ry="5"/>
  </g>

  <!-- body -->
  <path d="M 256 244 C 334 244 356 316 352 380 C 348 432 314 456 256 456 C 198 456 164 432 160 380 C 156 316 178 244 256 244 Z" fill="#FDFEFF"/>

  <!-- scrub top with pink trim -->
  <path d="M 194 280 C 220 268 292 268 318 280 L 336 402 C 298 418 214 418 176 402 Z" fill="url(#catScrub)"/>
  <path d="M 228 276 L 256 306 L 284 276" fill="none" stroke="#EE9BBB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pink sleeves -->
  <path d="M 194 280 C 172 288 158 306 154 330 L 192 342 Z" fill="#F6BBD0"/>
  <path d="M 318 280 C 340 288 354 306 358 330 L 320 342 Z" fill="#F6BBD0"/>
  <!-- apron waist + bow -->
  <path d="M 178 388 C 216 402 296 402 334 388 L 336 404 C 298 419 214 419 176 404 Z" fill="#F6BBD0"/>
  <g fill="#EE9BBB">
    <path d="M 256 396 c -14 -10 -30 -6 -32 4 c -2 9 8 14 18 12 c 6 -1 11 -6 14 -10 c 3 4 8 9 14 10 c 10 2 20 -3 18 -12 c -2 -10 -18 -14 -32 -4 Z"/>
    <circle cx="256" cy="398" r="6" fill="#E883A8"/>
    <path d="M 246 404 l -6 22 l 10 -4 Z"/><path d="M 266 404 l 6 22 l -10 -4 Z"/>
  </g>
  <!-- chest text + heart pocket -->
  <text x="256" y="330" font-family="Verdana, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#E883A8" text-anchor="middle" letter-spacing="1">DENTAL STAFF</text>
  <g transform="translate(298 352)">
    <rect x="-2" y="-2" width="44" height="38" rx="8" fill="#FBE3ED"/>
    <path d="M 20 8 c -6 -7 -16 -4 -16 5 c 0 7 9 13 16 18 c 7 -5 16 -11 16 -18 c 0 -9 -10 -12 -16 -5 Z" fill="#EE9BBB"/>
  </g>

  <!-- left arm holding floss jar -->
  <g>
    <path d="M 190 330 C 164 330 146 314 140 296 C 156 288 176 292 190 304 Z" fill="#FDFEFF"/>
    <g transform="rotate(-4 148 246)">
      <rect x="112" y="206" width="72" height="88" rx="14" fill="url(#flossJar)"/>
      <rect x="118" y="192" width="60" height="20" rx="9" fill="#E883A8"/>
      <path d="M 178 206 C 190 208 196 214 196 222 L 184 226 Z" fill="#FDFEFF"/>
      <rect x="120" y="222" width="56" height="58" rx="7" fill="#FFFFFF"/>
      <text x="148" y="244" font-family="Verdana, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#D96A94" text-anchor="middle">FLOSS</text>
      <text x="148" y="259" font-family="Verdana, 'Segoe UI', sans-serif" font-size="7.5" fill="#B285A0" text-anchor="middle">MINTY FRESH</text>
      <path d="M 148 264 c -4 0 -5 4 -4 7 c 2 3 2 5 3 8 c 0 2 3 2 3 0 c 0 -2 1 -3 2 -3 c 1 0 2 1 2 3 c 0 2 3 2 3 0 c 1 -3 1 -5 3 -8 c 1 -3 0 -7 -4 -7 c -2 0 -2 1 -4 1 c -2 0 -2 -1 -4 -1 Z" fill="#EE9BBB" transform="translate(2 0)"/>
      <ellipse cx="148" cy="288" rx="18" ry="12" fill="#FDFEFF"/>
    </g>
  </g>

  <!-- right arm holding mirror -->
  <g>
    <path d="M 322 330 C 348 330 366 314 372 296 C 356 288 336 292 322 304 Z" fill="#FDFEFF"/>
    <rect x="360" y="230" width="12" height="62" rx="6" fill="#EE9BBB" transform="rotate(7 366 260)"/>
    <circle cx="370" cy="222" r="24" fill="#C4A9B8"/>
    <circle cx="370" cy="222" r="18" fill="#F0E4EA"/>
    <path d="M 359 214 a 14 14 0 0 1 13 -6" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="366" cy="298" rx="17" ry="15" fill="#FDFEFF"/>
  </g>

  <!-- head -->
  <circle cx="256" cy="160" r="102" fill="#FDFEFF"/>
  <!-- calico patches -->
  <path d="M 168 106 C 186 78 214 62 244 58 C 232 90 214 118 186 136 C 176 128 170 118 168 106 Z" fill="#E8933F"/>
  <path d="M 344 106 C 326 78 298 62 268 58 C 280 90 298 118 326 136 C 336 128 342 118 344 106 Z" fill="#3A3A44"/>
  <!-- ears -->
  <path d="M 170 96 L 148 34 L 210 62 Z" fill="#E8933F"/>
  <path d="M 174 88 L 162 52 L 198 68 Z" fill="#F5A8BC"/>
  <path d="M 342 96 L 364 34 L 302 62 Z" fill="#3A3A44"/>
  <path d="M 338 88 L 350 52 L 314 68 Z" fill="#F5A8BC"/>

  <!-- eyes: big sparkle (female: lashes) -->
  <g>
    <circle cx="216" cy="158" r="27" fill="#3A3A44"/>
    <circle cx="216" cy="158" r="19" fill="#5C5470"/>
    <circle cx="224" cy="150" r="8" fill="#FFFFFF"/>
    <circle cx="209" cy="166" r="3.6" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 212 160 l 2.5 5 l 5 2.5 l -5 2.5 l -2.5 5 l -2.5 -5 l -5 -2.5 l 5 -2.5 Z" fill="#F5A8BC" opacity="0.9"/>
    <circle cx="296" cy="158" r="27" fill="#3A3A44"/>
    <circle cx="296" cy="158" r="19" fill="#5C5470"/>
    <circle cx="304" cy="150" r="8" fill="#FFFFFF"/>
    <circle cx="289" cy="166" r="3.6" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 292 160 l 2.5 5 l 5 2.5 l -5 2.5 l -2.5 5 l -2.5 -5 l -5 -2.5 l 5 -2.5 Z" fill="#F5A8BC" opacity="0.9"/>
    <g stroke="#3A3A44" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 189 146 l -12 -6"/><path d="M 191 138 l -10 -8"/>
      <path d="M 323 146 l 12 -6"/><path d="M 321 138 l 10 -8"/>
    </g>
  </g>
  <!-- blush -->
  <ellipse cx="192" cy="192" rx="14" ry="8" fill="#F5A8BC" opacity="0.6"/>
  <ellipse cx="320" cy="192" rx="14" ry="8" fill="#F5A8BC" opacity="0.6"/>

  <!-- muzzle -->
  <path d="M 246 186 C 250 182 262 182 266 186 C 264 194 260 198 256 198 C 252 198 248 194 246 186 Z" fill="#F08BAB"/>
  <path d="M 256 198 C 256 206 250 210 244 210 M 256 198 C 256 206 262 210 268 210" fill="none" stroke="#3A3A44" stroke-width="4" stroke-linecap="round"/>
  <path d="M 236 212 C 244 220 268 220 276 212" fill="none" stroke="#3A3A44" stroke-width="4" stroke-linecap="round"/>
  <path d="M 244 213 l 4 7 l 4 -6 Z" fill="#FFFFFF"/>
  <path d="M 260 214 l 4 6 l 4 -7 Z" fill="#FFFFFF"/>
  <!-- whiskers -->
  <g stroke="#D9C2CC" stroke-width="3" stroke-linecap="round">
    <line x1="182" y1="196" x2="142" y2="188"/><line x1="184" y1="210" x2="146" y2="212"/>
    <line x1="330" y1="196" x2="370" y2="188"/><line x1="328" y1="210" x2="366" y2="212"/>
  </g>
</svg>
