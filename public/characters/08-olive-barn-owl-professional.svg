<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Olive the Barn Owl, office professional mascot (female)">
  <defs>
    <linearGradient id="owlWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B88C"/>
      <stop offset="1" stop-color="#C29E6E"/>
    </linearGradient>
    <linearGradient id="owlScrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CCFC6"/>
      <stop offset="1" stop-color="#5FB3A8"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="256" cy="484" rx="116" ry="13" fill="#2A2416" opacity="0.08"/>

  <!-- legs and feet -->
  <g stroke="#C7A06B" stroke-width="12" stroke-linecap="round">
    <line x1="230" y1="430" x2="230" y2="462"/>
    <line x1="282" y1="430" x2="282" y2="462"/>
  </g>
  <g stroke="#C7A06B" stroke-width="9" stroke-linecap="round">
    <line x1="230" y1="462" x2="212" y2="476"/><line x1="230" y1="462" x2="230" y2="478"/><line x1="230" y1="462" x2="248" y2="476"/>
    <line x1="282" y1="462" x2="264" y2="476"/><line x1="282" y1="462" x2="282" y2="478"/><line x1="282" y1="462" x2="300" y2="476"/>
  </g>

  <!-- body -->
  <path d="M 256 240 C 328 240 350 312 346 376 C 342 426 310 450 256 450 C 202 450 170 426 166 376 C 162 312 184 240 256 240 Z" fill="#F3E4CC"/>

  <!-- scrub top (teal) -->
  <path d="M 198 272 C 222 262 290 262 314 272 L 332 416 C 296 432 216 432 180 416 Z" fill="url(#owlScrub)"/>
  <path d="M 230 268 L 256 296 L 282 268" fill="none" stroke="#4E9A8F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 198 272 C 178 280 166 296 162 318 L 196 328 Z" fill="#5FB3A8"/>
  <path d="M 314 272 C 334 280 346 296 350 318 L 316 328 Z" fill="#5FB3A8"/>
  <path d="M 184 398 C 216 410 296 410 328 398" fill="none" stroke="#4E9A8F" stroke-width="3.5" stroke-dasharray="7 6"/>
  <!-- lanyard + badge -->
  <path d="M 232 268 L 250 322 M 280 268 L 262 322" stroke="#F2CE4B" stroke-width="5" fill="none"/>
  <g transform="rotate(3 256 340)">
    <rect x="234" y="322" width="44" height="34" rx="6" fill="#FDFEFF" stroke="#C9D6E4" stroke-width="3"/>
    <circle cx="245" cy="334" r="6" fill="#D9B88C"/>
    <rect x="255" y="330" width="16" height="4" rx="2" fill="#AEBBCB"/>
    <rect x="255" y="338" width="12" height="4" rx="2" fill="#AEBBCB"/>
    <path d="M 240 348 h 30" stroke="#5FB3A8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- right wing holding pen -->
  <g>
    <path d="M 318 300 C 348 296 368 280 376 258 C 356 250 336 256 322 270 Z" fill="url(#owlWing)"/>
    <path d="M 356 282 C 366 276 372 268 374 258 L 362 262 Z" fill="#B08A58"/>
    <g transform="rotate(34 376 236)">
      <rect x="370" y="196" width="11" height="66" rx="5.5" fill="#5FB3A8"/>
      <path d="M 370 262 L 375.5 276 L 381 262 Z" fill="#2F4A78"/>
      <rect x="370" y="196" width="11" height="10" rx="4" fill="#F2CE4B"/>
    </g>
    <ellipse cx="366" cy="264" rx="15" ry="13" fill="#D9B88C"/>
  </g>

  <!-- clipboard with dental chart (left wing) -->
  <g>
    <g transform="rotate(-6 148 300)">
      <rect x="96" y="228" width="110" height="140" rx="12" fill="#C7A06B"/>
      <rect x="106" y="240" width="90" height="118" rx="6" fill="#FDFEFF"/>
      <rect x="130" y="218" width="42" height="20" rx="7" fill="#8B98A8"/>
      <text x="151" y="258" font-family="Verdana, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#2F4A78" text-anchor="middle">SMILE CHART</text>
      <!-- two rows of teeth -->
      <g fill="#EAF0F8" stroke="#9DB2C9" stroke-width="2">
        <rect x="114" y="268" width="15" height="18" rx="6"/><rect x="133" y="268" width="15" height="18" rx="6"/>
        <rect x="152" y="268" width="15" height="18" rx="6"/><rect x="171" y="268" width="15" height="18" rx="6"/>
        <rect x="114" y="292" width="15" height="18" rx="6"/><rect x="133" y="292" width="15" height="18" rx="6"/>
        <rect x="152" y="292" width="15" height="18" rx="6"/><rect x="171" y="292" width="15" height="18" rx="6"/>
      </g>
      <!-- green checks -->
      <g stroke="#4CAF7D" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 117 276 l 4 5 l 6 -8"/>
        <path d="M 155 276 l 4 5 l 6 -8"/>
        <path d="M 136 300 l 4 5 l 6 -8"/>
        <path d="M 174 300 l 4 5 l 6 -8"/>
      </g>
      <path d="M 114 322 h 74 M 114 334 h 56 M 114 346 h 64" stroke="#C9D6E4" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M 194 300 C 166 302 146 292 136 274 C 152 264 172 266 188 278 Z" fill="url(#owlWing)"/>
    <ellipse cx="146" cy="282" rx="15" ry="13" fill="#D9B88C"/>
  </g>

  <!-- wing scallops on shoulders -->
  <path d="M 166 318 C 158 342 158 366 166 386 C 176 372 180 348 178 326 Z" fill="url(#owlWing)"/>
  <path d="M 346 318 C 354 342 354 366 346 386 C 336 372 332 348 334 326 Z" fill="url(#owlWing)"/>

  <!-- head: tawny back + heart facial disc -->
  <circle cx="256" cy="150" r="96" fill="url(#owlWing)"/>
  <!-- speckles -->
  <g fill="#B08A58" opacity="0.7">
    <circle cx="182" cy="92" r="3"/><circle cx="206" cy="70" r="3"/><circle cx="238" cy="58" r="3"/>
    <circle cx="278" cy="58" r="3"/><circle cx="310" cy="72" r="3"/><circle cx="332" cy="96" r="3"/>
    <circle cx="196" cy="118" r="2.5"/><circle cx="318" cy="120" r="2.5"/>
  </g>
  <!-- heart-shaped facial disc -->
  <path d="M 256 78
           C 216 66 180 92 176 138
           C 172 186 208 226 256 234
           C 304 226 340 186 336 138
           C 332 92 296 66 256 78 Z"
        fill="#FDF8EE" stroke="#C7A06B" stroke-width="5"/>
  <path d="M 256 78 C 252 88 252 98 256 108 C 260 98 260 88 256 78 Z" fill="#C7A06B" opacity="0.6"/>

  <!-- eyes + glasses (female: lashes) -->
  <g>
    <circle cx="220" cy="150" r="17" fill="#3B2A1D"/>
    <circle cx="226" cy="144" r="5.5" fill="#FFFFFF"/>
    <circle cx="292" cy="150" r="17" fill="#3B2A1D"/>
    <circle cx="298" cy="144" r="5.5" fill="#FFFFFF"/>
    <g fill="none" stroke="#B8935E" stroke-width="5">
      <circle cx="220" cy="150" r="26"/>
      <circle cx="292" cy="150" r="26"/>
      <path d="M 246 148 C 250 144 262 144 266 148"/>
      <path d="M 194 144 L 180 138"/><path d="M 318 144 L 332 138"/>
    </g>
    <g stroke="#3B2A1D" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 202 128 l -8 -6"/><path d="M 208 123 l -6 -8"/>
      <path d="M 310 128 l 8 -6"/><path d="M 304 123 l -6 -8" transform="scale(-1 1) translate(-608 0)"/>
    </g>
  </g>
  <!-- beak -->
  <path d="M 248 176 C 252 172 260 172 264 176 C 262 190 258 198 256 198 C 254 198 250 190 248 176 Z" fill="#D9A05E"/>
  <!-- gentle smile below beak -->
  <path d="M 240 204 C 248 212 264 212 272 204" fill="none" stroke="#B08A58" stroke-width="4" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="198" cy="180" rx="12" ry="7" fill="#F5A8BC" opacity="0.5"/>
  <ellipse cx="314" cy="180" rx="12" ry="7" fill="#F5A8BC" opacity="0.5"/>
</svg>
