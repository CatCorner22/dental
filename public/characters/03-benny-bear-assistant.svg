<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Benny the Black Bear, dental assistant mascot (male)">
  <defs>
    <linearGradient id="bearFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A55"/>
      <stop offset="1" stop-color="#33333D"/>
    </linearGradient>
    <linearGradient id="bearScrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDCF2"/>
      <stop offset="1" stop-color="#9EC7E8"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="256" cy="486" rx="132" ry="14" fill="#14141C" opacity="0.1"/>

  <!-- legs -->
  <path d="M 206 420 L 206 470 C 206 480 216 486 228 486 C 240 486 248 480 248 470 L 248 424 Z" fill="#8FBBE0"/>
  <path d="M 264 424 L 264 470 C 264 480 272 486 284 486 C 296 486 306 480 306 470 L 306 420 Z" fill="#8FBBE0"/>
  <ellipse cx="227" cy="482" rx="26" ry="10" fill="#3B3B46"/>
  <ellipse cx="285" cy="482" rx="26" ry="10" fill="#3B3B46"/>

  <!-- body -->
  <path d="M 256 240 C 340 240 362 316 358 382 C 354 434 318 458 256 458 C 194 458 158 434 154 382 C 150 316 172 240 256 240 Z" fill="url(#bearFur)"/>

  <!-- scrub top -->
  <path d="M 192 276 C 218 264 294 264 320 276 L 342 434 C 300 452 212 452 170 434 Z" fill="url(#bearScrub)"/>
  <path d="M 228 272 L 256 302 L 284 272" fill="none" stroke="#79ABD4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 256 302 L 256 316 C 250 312 246 306 244 300 Z" fill="#33333D"/>
  <!-- sleeves -->
  <path d="M 192 276 C 170 284 156 302 152 326 L 190 338 Z" fill="#9EC7E8"/>
  <path d="M 320 276 C 342 284 356 302 360 326 L 322 338 Z" fill="#9EC7E8"/>
  <!-- hip pockets, heart -->
  <path d="M 186 402 l 44 6 l -3 34 l -44 -7 Z" fill="#AFD2ED"/>
  <path d="M 326 402 l -44 6 l 3 34 l 44 -7 Z" fill="#AFD2ED"/>
  <path d="M 304 424 c -5 -6 -14 -3 -14 4 c 0 6 8 11 14 15 c 6 -4 14 -9 14 -15 c 0 -7 -9 -10 -14 -4 Z" fill="#F2A0B5"/>

  <!-- name badge -->
  <g transform="rotate(-2 316 320)">
    <rect x="284" y="300" width="86" height="46" rx="8" fill="#FDFEFF" stroke="#C9D6E4" stroke-width="3"/>
    <rect x="318" y="288" width="18" height="14" rx="3" fill="#AEBBCB"/>
    <text x="327" y="322" font-family="Verdana, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#2F4A78" text-anchor="middle">BENNY</text>
    <text x="327" y="337" font-family="Verdana, 'Segoe UI', sans-serif" font-size="8" fill="#5B7597" text-anchor="middle">DENTAL ASSISTANT</text>
    <path d="M 292 306 c -3 -4 -9 -2 -9 3 c 0 4 5 7 9 9 c 4 -2 9 -5 9 -9 c 0 -5 -6 -7 -9 -3 Z" fill="#F2A0B5"/>
  </g>

  <!-- instrument tray -->
  <g>
    <g stroke-linecap="round">
      <rect x="196" y="330" width="9" height="46" rx="4.5" fill="#9DA8B4"/>
      <circle cx="200" cy="322" r="10" fill="#DDEBF4" stroke="#9DA8B4" stroke-width="3.5"/>
      <rect x="222" y="328" width="8" height="48" rx="4" fill="#F2A0B5"/>
      <path d="M 226 328 L 226 314 L 234 306" fill="none" stroke="#9DA8B4" stroke-width="6"/>
      <rect x="248" y="328" width="8" height="48" rx="4" fill="#9EC7E8"/>
      <path d="M 252 328 L 252 312 L 246 304" fill="none" stroke="#9DA8B4" stroke-width="6"/>
      <rect x="274" y="330" width="9" height="46" rx="4.5" fill="#9DA8B4"/>
      <path d="M 278 330 C 272 318 274 308 282 302 M 278 330 C 286 318 286 308 280 302" fill="none" stroke="#9DA8B4" stroke-width="5"/>
    </g>
    <rect x="164" y="368" width="184" height="30" rx="10" fill="#BFDCF2" stroke="#8FB4D6" stroke-width="4"/>
    <path d="M 326 384 c -3 -4 -8 -2 -8 2 c 0 3 4 6 8 8 c 4 -2 8 -5 8 -8 c 0 -4 -5 -6 -8 -2 Z" fill="#6E93C4"/>
  </g>

  <!-- paws over tray edges -->
  <ellipse cx="168" cy="384" rx="24" ry="21" fill="#3B3B46"/>
  <ellipse cx="344" cy="384" rx="24" ry="21" fill="#3B3B46"/>
  <g stroke="#23232B" stroke-width="4" stroke-linecap="round">
    <path d="M 160 374 l 0 10"/><path d="M 170 372 l 0 11"/>
    <path d="M 352 374 l 0 10"/><path d="M 342 372 l 0 11"/>
  </g>

  <!-- head -->
  <circle cx="256" cy="158" r="104" fill="url(#bearFur)"/>
  <!-- ears -->
  <circle cx="172" cy="80" r="30" fill="#33333D"/>
  <circle cx="172" cy="82" r="15" fill="#5A5A66"/>
  <circle cx="340" cy="80" r="30" fill="#33333D"/>
  <circle cx="340" cy="82" r="15" fill="#5A5A66"/>
  <!-- fluffy cheeks hint -->
  <path d="M 162 190 C 172 206 188 216 206 220 L 200 200 Z" fill="#3F3F4A"/>
  <path d="M 350 190 C 340 206 324 216 306 220 L 312 200 Z" fill="#3F3F4A"/>

  <!-- muzzle -->
  <ellipse cx="256" cy="196" rx="56" ry="42" fill="#D9BC9C"/>
  <path d="M 238 176 C 244 168 268 168 274 176 C 272 188 264 194 256 194 C 248 194 240 188 238 176 Z" fill="#23232B"/>
  <path d="M 256 194 L 256 208" stroke="#A98B67" stroke-width="4" stroke-linecap="round"/>
  <path d="M 234 212 C 244 224 268 224 278 212" fill="none" stroke="#4A3527" stroke-width="5" stroke-linecap="round"/>
  <path d="M 250 216 h 12 v 5 a 6 6 0 0 1 -12 0 Z" fill="#FFFFFF"/>

  <!-- eyes (male: soft brows) -->
  <g>
    <circle cx="212" cy="148" r="15" fill="#2A1F16"/>
    <circle cx="217" cy="143" r="5" fill="#FFFFFF"/>
    <circle cx="208" cy="153" r="2.4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="300" cy="148" r="15" fill="#2A1F16"/>
    <circle cx="305" cy="143" r="5" fill="#FFFFFF"/>
    <circle cx="296" cy="153" r="2.4" fill="#FFFFFF" opacity="0.85"/>
    <path d="M 196 124 C 202 119 214 118 222 121" fill="none" stroke="#23232B" stroke-width="6" stroke-linecap="round"/>
    <path d="M 290 121 C 298 118 310 119 316 124" fill="none" stroke="#23232B" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- blush -->
  <ellipse cx="188" cy="180" rx="13" ry="8" fill="#C98A8A" opacity="0.4"/>
  <ellipse cx="324" cy="180" rx="13" ry="8" fill="#C98A8A" opacity="0.4"/>
</svg>
