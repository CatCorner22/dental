<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nova the Astronaut Dinosaur mascot (gender-neutral)">
  <defs>
    <linearGradient id="dinoSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ED4A9"/>
      <stop offset="1" stop-color="#63BC8C"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E9F2"/>
    </linearGradient>
    <radialGradient id="brushGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6C9" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFEC9E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFEC9E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="helmetGlass" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#EAF6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9CC8EC" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <!-- stars -->
  <g fill="#F2CE4B">
    <path d="M 88 96 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 Z"/>
    <path d="M 430 150 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z"/>
    <circle cx="120" cy="200" r="4"/>
  </g>
  <circle cx="404" cy="84" r="4" fill="#6FA8DC"/>
  <circle cx="72" cy="300" r="4" fill="#9B7FD4"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="486" rx="128" ry="14" fill="#1E3A4A" opacity="0.08"/>

  <!-- tail with plates (behind) -->
  <path d="M 330 400 C 380 400 412 424 420 452 C 392 466 352 462 330 444 Z" fill="#63BC8C"/>
  <g fill="#F7E8C8">
    <path d="M 366 400 C 370 388 378 382 388 380 C 386 392 380 400 372 406 Z"/>
    <path d="M 396 416 C 402 406 412 402 422 402 C 418 414 410 420 402 424 Z"/>
  </g>

  <!-- boots -->
  <path d="M 202 442 L 202 468 C 194 470 188 476 188 482 C 188 488 198 490 214 490 C 236 490 244 486 244 476 L 244 442 Z" fill="url(#suit)" stroke="#C2CBD9" stroke-width="4"/>
  <path d="M 310 442 L 310 468 C 318 470 324 476 324 482 C 324 488 314 490 298 490 C 276 490 268 486 268 476 L 268 442 Z" fill="url(#suit)" stroke="#C2CBD9" stroke-width="4"/>
  <rect x="196" y="462" width="48" height="8" rx="4" fill="#F0873F"/>
  <rect x="268" y="462" width="48" height="8" rx="4" fill="#F0873F"/>

  <!-- suit body -->
  <path d="M 256 244 C 336 244 358 314 354 380 C 350 432 316 454 256 454 C 196 454 162 432 158 380 C 154 314 176 244 256 244 Z" fill="url(#suit)" stroke="#C2CBD9" stroke-width="4"/>

  <!-- chest control panel -->
  <rect x="212" y="316" width="88" height="64" rx="12" fill="#D6E4F2" stroke="#AFC2D9" stroke-width="4"/>
  <circle cx="234" cy="338" r="8" fill="#F26D6D"/>
  <circle cx="256" cy="338" r="8" fill="#F2CE4B"/>
  <circle cx="278" cy="338" r="8" fill="#7FC97F"/>
  <rect x="226" y="356" width="60" height="12" rx="6" fill="#FFFFFF" stroke="#AFC2D9" stroke-width="3"/>
  <!-- tooth mission patch -->
  <g transform="translate(304 292)">
    <circle r="21" fill="#FFFFFF" stroke="#F0873F" stroke-width="4"/>
    <path d="M -8 -8 c -5 0 -7 5 -5 9 c 2 4 3 7 3 10 c 1 3 4 3 4 0 c 1 -2 1 -4 3 -4 h 6 c 2 0 2 2 3 4 c 0 3 3 3 4 0 c 0 -3 1 -6 3 -10 c 2 -4 0 -9 -5 -9 c -3 0 -5 1 -8 1 c -3 0 -5 -1 -8 -1 Z" transform="translate(2 2) scale(1.05)" fill="#6FA8DC"/>
  </g>

  <!-- utility belt -->
  <rect x="170" y="392" width="172" height="18" rx="9" fill="#F0873F"/>
  <rect x="240" y="390" width="32" height="22" rx="6" fill="#D9772F"/>

  <!-- left arm holding glowing toothbrush -->
  <g>
    <circle cx="142" cy="222" r="64" fill="url(#brushGlow)"/>
    <path d="M 190 316 C 164 316 146 300 140 282 C 156 274 176 278 190 290 Z" fill="url(#suit)" stroke="#C2CBD9" stroke-width="4"/>
    <g transform="rotate(-26 148 262)">
      <rect x="140" y="212" width="17" height="100" rx="8.5" fill="#6FA8DC" stroke="#4E86BC" stroke-width="4"/>
      <rect x="134" y="170" width="29" height="46" rx="11" fill="#FFFFFF" stroke="#4E86BC" stroke-width="4"/>
      <g fill="#CFE6F7">
        <rect x="139" y="151" width="6" height="23" rx="3"/>
        <rect x="147" y="151" width="6" height="23" rx="3"/>
        <rect x="155" y="151" width="6" height="23" rx="3"/>
      </g>
    </g>
    <circle cx="146" cy="286" r="17" fill="#8ED4A9"/>
    <path d="M 122 168 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- right arm thumbs-up -->
  <g>
    <path d="M 322 316 C 348 316 366 300 372 282 C 356 274 336 278 322 290 Z" fill="url(#suit)" stroke="#C2CBD9" stroke-width="4"/>
    <circle cx="366" cy="286" r="17" fill="#8ED4A9"/>
    <rect x="368" y="258" width="13" height="22" rx="6.5" fill="#8ED4A9"/>
  </g>

  <!-- helmet ring -->
  <ellipse cx="256" cy="248" rx="74" ry="20" fill="#C2CBD9"/>
  <ellipse cx="256" cy="244" rx="74" ry="20" fill="#E4E9F2"/>

  <!-- head -->
  <g>
    <ellipse cx="256" cy="164" rx="88" ry="80" fill="url(#dinoSkin)"/>
    <!-- head plates -->
    <g fill="#F7E8C8">
      <path d="M 236 88 C 238 72 248 62 260 58 C 258 72 252 82 244 90 Z"/>
      <path d="M 272 86 C 278 72 288 66 300 64 C 296 78 288 86 278 92 Z"/>
    </g>
    <!-- snout -->
    <ellipse cx="256" cy="196" rx="52" ry="34" fill="#B9E6C8"/>
    <ellipse cx="238" cy="188" rx="5" ry="7" fill="#4E9A70"/>
    <ellipse cx="274" cy="188" rx="5" ry="7" fill="#4E9A70"/>
    <path d="M 230 210 C 240 222 272 222 282 210" fill="none" stroke="#3E7A58" stroke-width="5" stroke-linecap="round"/>
    <path d="M 248 214 h 16 v 5 a 8 8 0 0 1 -16 0 Z" fill="#FFFFFF"/>
    <!-- eyes: friendly, neutral -->
    <circle cx="216" cy="152" r="16" fill="#2E4A3A"/>
    <circle cx="222" cy="146" r="5.5" fill="#FFFFFF"/>
    <circle cx="296" cy="152" r="16" fill="#2E4A3A"/>
    <circle cx="302" cy="146" r="5.5" fill="#FFFFFF"/>
    <ellipse cx="196" cy="182" rx="12" ry="7" fill="#F5A8BC" opacity="0.5"/>
    <ellipse cx="316" cy="182" rx="12" ry="7" fill="#F5A8BC" opacity="0.5"/>
  </g>

  <!-- glass dome helmet -->
  <circle cx="256" cy="160" r="102" fill="url(#helmetGlass)" stroke="#9CC8EC" stroke-width="5"/>
  <path d="M 180 110 A 92 92 0 0 1 232 68" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <!-- antenna -->
  <line x1="256" y1="58" x2="256" y2="34" stroke="#C2CBD9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="28" r="8" fill="#F26D6D"/>
</svg>
