<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Smile Notes logomark">
  <!--
    Smile Notes logomark: "the note that checks itself."
    A note card holding a squat, friendly molar; a teal verification badge
    overlays the lower-right corner. Original work, hand-authored as vector
    paths - no stock art, no third-party elements, no fonts.
    (c) 2026 Blake Reagan. All rights reserved.
  -->
  <!-- Note card -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="#2B6CB8"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#sheen)"/>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A93D6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E4E8C" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- Writing rules: this is a NOTE, not just an app tile -->
  <rect x="118" y="120" width="150" height="18" rx="9" fill="#FFFFFF" opacity="0.35"/>
  <rect x="118" y="158" width="96" height="18" rx="9" fill="#FFFFFF" opacity="0.22"/>
  <!-- Molar: squat and wide, two rounded cusps, two stubby root-feet -->
  <path
    fill="#FFFFFF"
    d="M256 196
       c-16 -14 -42 -14 -56 4
       c-13 16 -12 40 -4 58
       c7 15 10 30 12 58
       c1 16 22 16 25 1
       c3 -17 6 -29 23 -29
       c17 0 20 12 23 29
       c3 15 24 15 25 -1
       c2 -28 5 -43 12 -58
       c8 -18 9 -42 -4 -58
       c-14 -18 -40 -18 -56 -4
       z"/>
  <!-- Smile on the crown -->
  <path d="M226 254 q30 24 60 0" fill="none" stroke="#2B6CB8" stroke-width="14" stroke-linecap="round"/>
  <!-- Verification badge -->
  <circle cx="376" cy="376" r="84" fill="#5FB3A8" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M338 378 l26 26 l50 -56" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
