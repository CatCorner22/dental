name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version-stamp guard below diffs against the PR
          # base, and a shallow clone has no merge base to diff from
          # ("fatal: origin/main...HEAD: no merge base" on every PR).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The versioning discipline, enforced rather than hoped for: a change to
      # the rules, vocabulary, or modules that ships under an unchanged
      # RULESET_VERSION makes every stamped audit report a lie about which
      # rules actually ran. Same for AI prompts and ASSIST_PROMPT_VERSION.
      - name: Rule changes must bump their version stamp
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          rules_changed=$(echo "$CHANGED" | grep -E '^src/lib/(vocab|modules)/|^src/lib/audit/(rules/|maskPhi)' | grep -v '\.test\.ts$' || true)
          version_changed=$(echo "$CHANGED" | grep -c '^src/lib/version\.ts$' || true)
          if [ -n "$rules_changed" ] && [ "$version_changed" = "0" ]; then
            echo "::error::Rules/vocab/modules changed without bumping RULESET_VERSION in src/lib/version.ts:"
            echo "$rules_changed"
            exit 1
          fi
          prompts_changed=$(echo "$CHANGED" | grep -c '^src/lib/assist/prompts\.ts$' || true)
          if [ "$prompts_changed" != "0" ] && ! git diff "$BASE"...HEAD -- src/lib/assist/prompts.ts | grep -q 'ASSIST_PROMPT_VERSION'; then
            echo "::error::AI prompts changed without touching ASSIST_PROMPT_VERSION in src/lib/assist/prompts.ts"
            exit 1
          fi
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret

  cross-browser:
    # Drives the production build in Chromium, Firefox, and WebKit (Safari's
    # engine). The dev sandbox cannot download WebKit/Firefox, so this is the
    # only place the Safari-specific fixes get executed rather than reasoned
    # about. Non-blocking on itself: if it flakes, the test-and-build job above
    # is still the merge gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is not a project dependency (the dev sandbox cannot fetch its
      # browsers), so install it here without touching package.json/lockfile.
      - name: Install Playwright + browsers
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret
      - name: Start app and run cross-browser smoke
        env:
          AUTH_SECRET: ci-build-only-secret
          ADMIN_USERNAME: smokeadmin
          ADMIN_PASSWORD: smoke-pass-12345
          PGLITE_DIR: memory://
          SMOKE_USER: smokeadmin
          SMOKE_PASS: smoke-pass-12345
          BASE_URL: http://127.0.0.1:3000
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/login >/dev/null && break
            sleep 1
          done
          node e2e/crossbrowser.smoke.mjs
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
