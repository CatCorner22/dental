<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Smile Notes logomark">
  <!--
    Smile Notes logomark v2 - "the note that checks itself", atomic-age edition.
    A note card holding a squat, friendly molar rides an atomic orbit with a
    satellite spark; a teal verification badge overlays the corner and
    starbursts celebrate. Retro-future optimism (Googie / Space Age), kept
    clinical-calm. Original work, hand-authored vector paths - no stock art,
    no third-party elements, no fonts.
    (c) 2026 Blake Reagan. All rights reserved.
  -->
  <!-- Atomic orbit, behind the card -->
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="242" ry="102" fill="none" stroke="#F26D6D" stroke-width="13" opacity="0.9"/>
    <circle cx="498" cy="256" r="15" fill="#F26D6D"/>
  </g>
  <!-- Note card -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="#2B6CB8"/>
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#sheen)"/>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A93D6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E4E8C" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- Writing rules: this is a NOTE, not just an app tile -->
  <rect x="126" y="128" width="140" height="17" rx="8.5" fill="#FFFFFF" opacity="0.35"/>
  <rect x="126" y="164" width="90" height="17" rx="8.5" fill="#FFFFFF" opacity="0.22"/>
  <!-- Molar: squat and wide, two rounded cusps, two stubby root-feet -->
  <path
    fill="#FFFFFF"
    d="M256 200
       c-16 -14 -42 -14 -56 4
       c-13 16 -12 40 -4 58
       c7 15 10 30 12 58
       c1 16 22 16 25 1
       c3 -17 6 -29 23 -29
       c17 0 20 12 23 29
       c3 15 24 15 25 -1
       c2 -28 5 -43 12 -58
       c8 -18 9 -42 -4 -58
       c-14 -18 -40 -18 -56 -4
       z"/>
  <!-- Smile on the crown -->
  <path d="M226 258 q30 24 60 0" fill="none" stroke="#2B6CB8" stroke-width="14" stroke-linecap="round"/>
  <!-- Starbursts: the atomic-age sparkle -->
  <path d="M96 106 q10 22 32 32 q-22 10 -32 32 q-10 -22 -32 -32 q22 -10 32 -32 z" fill="#F2CE4B"/>
  <path d="M428 96 q6 14 20 20 q-14 6 -20 20 q-6 -14 -20 -20 q14 -6 20 -20 z" fill="#FFFFFF"/>
  <!-- Verification badge -->
  <circle cx="380" cy="380" r="82" fill="#5FB3A8" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M344 382 l25 25 l48 -54" fill="none" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
