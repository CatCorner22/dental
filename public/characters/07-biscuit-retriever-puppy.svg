<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Biscuit the Golden Retriever Puppy mascot (gender-neutral)">
  <defs>
    <linearGradient id="pupFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0CE96"/>
      <stop offset="1" stop-color="#E0B274"/>
    </linearGradient>
    <linearGradient id="pupTee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4E0F5"/>
      <stop offset="1" stop-color="#A3CDEF"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="256" cy="486" rx="126" ry="14" fill="#3A2C14" opacity="0.08"/>

  <!-- wagging tail (behind) -->
  <g>
    <path d="M 340 388 C 386 376 408 348 408 316 C 388 318 368 332 356 352 C 348 366 342 378 336 388 Z" fill="#E0B274"/>
    <path d="M 398 330 C 404 322 407 314 408 306 C 396 308 386 314 380 322 Z" fill="#F7E3BC"/>
    <g stroke="#D9BC8C" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M 416 348 C 424 342 430 334 432 324"/>
      <path d="M 420 368 C 430 364 438 356 442 346"/>
    </g>
  </g>

  <!-- hind paws -->
  <ellipse cx="212" cy="470" rx="34" ry="22" fill="url(#pupFur)"/>
  <ellipse cx="300" cy="470" rx="34" ry="22" fill="url(#pupFur)"/>
  <g fill="#C89A5E" opacity="0.75">
    <ellipse cx="200" cy="478" rx="5" ry="4"/><ellipse cx="212" cy="480" rx="5" ry="4"/><ellipse cx="224" cy="478" rx="5" ry="4"/>
    <ellipse cx="288" cy="478" rx="5" ry="4"/><ellipse cx="300" cy="480" rx="5" ry="4"/><ellipse cx="312" cy="478" rx="5" ry="4"/>
  </g>

  <!-- body -->
  <path d="M 256 250 C 330 250 352 318 348 380 C 344 434 312 462 256 462 C 200 462 168 434 164 380 C 160 318 182 250 256 250 Z" fill="url(#pupFur)"/>

  <!-- tee -->
  <path d="M 198 282 C 222 272 290 272 314 282 L 330 408 C 294 424 218 424 182 408 Z" fill="url(#pupTee)"/>
  <path d="M 198 282 C 178 290 166 306 162 328 L 196 338 Z" fill="#A3CDEF"/>
  <path d="M 314 282 C 334 290 346 306 350 328 L 316 338 Z" fill="#A3CDEF"/>
  <!-- tooth pocket + cross -->
  <g transform="translate(292 336)">
    <rect x="0" y="0" width="46" height="42" rx="8" fill="#8FBFE8"/>
    <path d="M 15 8 c -5 0 -7 5 -5 9 c 2 4 3 8 3 11 c 1 3 4 3 4 0 c 1 -2 1 -4 3 -4 c 2 0 2 2 3 4 c 0 3 3 3 4 0 c 0 -3 1 -7 3 -11 c 2 -4 0 -9 -5 -9 c -3 0 -3 1 -5 1 c -2 0 -2 -1 -5 -1 Z" fill="#FFFFFF"/>
    <g fill="#2E8B7A" transform="translate(32 24)">
      <rect x="-3" y="-9" width="6" height="18" rx="2"/>
      <rect x="-9" y="-3" width="18" height="6" rx="2"/>
    </g>
  </g>

  <!-- bandana -->
  <path d="M 176 262 C 210 288 302 288 336 262 L 322 300 C 322 300 300 342 256 342 C 212 342 190 300 190 300 Z" fill="#4D9FE8"/>
  <path d="M 190 300 C 212 322 300 322 322 300 L 316 314 C 296 334 216 334 196 314 Z" fill="#3B87CC"/>
  <g transform="translate(256 306)">
    <circle r="24" fill="#6FB4F0"/>
    <circle r="24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M -10 -10 c -6 0 -8 6 -6 11 c 3 5 4 9 4 13 c 1 4 5 4 5 0 c 1 -3 1 -5 4 -5 c 3 0 3 2 4 5 c 0 4 4 4 5 0 c 0 -4 1 -8 4 -13 c 2 -5 0 -11 -6 -11 c -3 0 -4 1 -7 1 c -3 0 -4 -1 -7 -1 Z" fill="#FFFFFF" transform="translate(3 3)"/>
  </g>
  <!-- knot tails -->
  <path d="M 322 276 C 344 268 360 270 372 280 C 360 292 344 296 330 292 Z" fill="#4D9FE8"/>
  <path d="M 334 292 C 350 296 360 306 362 318 C 348 318 336 310 330 300 Z" fill="#3B87CC"/>

  <!-- big toothbrush held diagonally with both paws -->
  <g>
    <g transform="rotate(-38 256 360)">
      <rect x="196" y="342" width="200" height="34" rx="17" fill="#C9A8E8" stroke="#A985CC" stroke-width="4"/>
      <rect x="268" y="348" width="58" height="22" rx="11" fill="#9FDCC8"/>
      <path d="M 364 352 c 4 0 6 3 6 7 c 0 4 -2 7 -6 7" fill="none" stroke="#A985CC" stroke-width="3" stroke-linecap="round"/>
      <rect x="176" y="336" width="52" height="46" rx="12" fill="#EADAF7" stroke="#A985CC" stroke-width="4"/>
      <g fill="#FFFFFF" stroke="#D5C2E8" stroke-width="2">
        <rect x="182" y="312" width="9" height="28" rx="4.5"/>
        <rect x="194" y="312" width="9" height="28" rx="4.5"/>
        <rect x="206" y="312" width="9" height="28" rx="4.5"/>
        <rect x="218" y="312" width="9" height="28" rx="4.5"/>
      </g>
    </g>
    <!-- foam bubbles on bristles -->
    <g fill="#FFFFFF" stroke="#CFE4F2" stroke-width="3">
      <circle cx="150" cy="240" r="17"/>
      <circle cx="172" cy="222" r="13"/>
      <circle cx="136" cy="216" r="11"/>
      <circle cx="158" cy="204" r="8"/>
      <circle cx="186" cy="244" r="9"/>
    </g>
    <circle cx="146" cy="236" r="4" fill="#E4F0F8"/>
    <circle cx="170" cy="219" r="3" fill="#E4F0F8"/>
    <!-- paws on handle -->
    <ellipse cx="216" cy="330" rx="21" ry="19" fill="#F0CE96"/>
    <ellipse cx="298" cy="392" rx="21" ry="19" fill="#F0CE96"/>
    <g stroke="#D9B274" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 208 322 l 0 10"/><path d="M 218 320 l 0 11"/>
      <path d="M 290 384 l 0 10"/><path d="M 300 382 l 0 11"/>
    </g>
  </g>

  <!-- head -->
  <circle cx="256" cy="158" r="100" fill="url(#pupFur)"/>
  <!-- floppy ears -->
  <path d="M 172 84 C 140 96 124 132 128 176 C 132 208 148 228 168 232 C 180 210 184 178 182 146 C 181 122 178 100 172 84 Z" fill="#D4A05E"/>
  <path d="M 340 84 C 372 96 388 132 384 176 C 380 208 364 228 344 232 C 332 210 328 178 330 146 C 331 122 334 100 340 84 Z" fill="#D4A05E"/>
  <!-- fur tuft -->
  <path d="M 232 62 C 238 46 248 38 260 36 C 254 48 252 58 252 66 C 260 54 270 48 282 46 C 276 58 270 66 264 72 Z" fill="#F0CE96"/>

  <!-- face -->
  <ellipse cx="256" cy="200" rx="54" ry="40" fill="#FBEED3"/>
  <path d="M 236 178 C 242 170 270 170 276 178 C 274 190 266 196 256 196 C 246 196 238 190 236 178 Z" fill="#2B2B33"/>
  <ellipse cx="248" cy="177" rx="5" ry="3.5" fill="#5C5C66"/>
  <path d="M 256 196 L 256 208" stroke="#C89A5E" stroke-width="4" stroke-linecap="round"/>
  <path d="M 232 210 C 242 222 270 222 280 210" fill="none" stroke="#7A5A34" stroke-width="5" stroke-linecap="round"/>
  <!-- happy tongue -->
  <path d="M 244 219 C 244 236 250 244 258 244 C 266 244 270 236 270 220 C 262 224 252 224 244 219 Z" fill="#F08BAB"/>
  <path d="M 257 224 L 257 238" stroke="#D96A94" stroke-width="3" stroke-linecap="round"/>

  <!-- eyes: round, friendly, neutral -->
  <g>
    <circle cx="218" cy="150" r="19" fill="#3B2A1D"/>
    <circle cx="225" cy="143" r="6.5" fill="#FFFFFF"/>
    <circle cx="213" cy="156" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="294" cy="150" r="19" fill="#3B2A1D"/>
    <circle cx="301" cy="143" r="6.5" fill="#FFFFFF"/>
    <circle cx="289" cy="156" r="3" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <!-- brows: soft, symmetric -->
  <path d="M 202 124 C 210 119 222 119 230 123" fill="none" stroke="#C89A5E" stroke-width="5" stroke-linecap="round"/>
  <path d="M 282 123 C 290 119 302 119 310 124" fill="none" stroke="#C89A5E" stroke-width="5" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="194" cy="184" rx="14" ry="9" fill="#F5A8BC" opacity="0.6"/>
  <ellipse cx="318" cy="184" rx="14" ry="9" fill="#F5A8BC" opacity="0.6"/>
  <!-- whisker dots -->
  <g fill="#C89A5E">
    <circle cx="230" cy="204" r="2"/><circle cx="222" cy="210" r="2"/>
    <circle cx="282" cy="204" r="2"/><circle cx="290" cy="210" r="2"/>
  </g>
</svg>
